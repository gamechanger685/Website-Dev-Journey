<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOCTYPE Demo</title>
  <style>
    body { text-align: center; }
    .box {
      width: 200px;
      padding: 20px;
      border: 5px solid #3498db;
      background: #ecf0f1;
      margin: 20px 0;
      box-sizing: content-box; /* Default */
    }
    .box-border {
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h1>DOCTYPE Behavior Demo</h1>
  
  <h2>content-box (default)</h2>
  <div class="box">
    Width = 200px + 40 padding + 10 border = 250px total
  </div>

  <div style="width: 200px; padding: 20px; border: 5px solid;">
  Width = 200px (padding aur border ANDAR aate hain — IE 5.5 style)
  </div>
  
  <h2>border-box</h2>
  <div class="box box-border">
    Width = 200px total (padding + border ANDAR)
  </div>

  <script>
    console.log("Compat Mode:", document.compatMode);
    console.log("DOCTYPE:", document.doctype);
  </script>
</body>
</html>
