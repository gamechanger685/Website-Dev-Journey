<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Headings Example</title>
</head>
<body>
  <h1>Main Heading — Sirf Ek Per Page</h1>
  <h2>Section Heading</h2>
  <p>Yeh section ka content hai.</p>
  
  <h3>Subsection Heading</h3>
  <p>Yeh subsection ka content hai.</p>
  
  <h2>Doosra Section</h2>
  <p>Yeh doosre section ka content hai.</p>
</body>
</html>
